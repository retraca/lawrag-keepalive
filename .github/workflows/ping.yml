name: keep lawrag awake
on:
  schedule:
    - cron: "*/10 * * * *"     # every 10 minutes: Render's free instance sleeps after 15 idle
    - cron: "0 4 * * *"        # daily heartbeat commit
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -m 90 -o /dev/null -w "lawrag %{http_code} in %{time_total}s\n" https://lawrag-hf0n.onrender.com/
      # GitHub disables schedules in repos with no commits for 60 days. One heartbeat commit
      # a day keeps this one alive.
      - uses: actions/checkout@v4
        if: github.event.schedule == '0 4 * * *' || github.event_name == 'workflow_dispatch'
      - if: github.event.schedule == '0 4 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          date -u > heartbeat.txt
          git config user.name "keepalive" && git config user.email "keepalive@users.noreply.github.com"
          git add heartbeat.txt && git commit -m "heartbeat" && git push
